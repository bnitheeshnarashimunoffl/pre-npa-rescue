# CI (owned by WS5) - A8.6. Branch protection should require the single "ci-passed" check.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  DATAGEN_N_CUSTOMERS: "2000"
  LLM_PROVIDER: mock
  SEED: "42"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      contracts: ${{ steps.filter.outputs.contracts }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # On push to main every job runs anyway, so only PRs are path-filtered.
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            python:
              - *shared
              - 'packages/**'
              - 'services/**'
              - 'redteam/**'
              - 'scripts/**'
              - 'contracts/fixtures/**'
            contracts:
              - *shared
              - 'contracts/**'
              - 'packages/contracts/**'
              - 'services/api/app/**'
              - 'scripts/**'
            web:
              - '.github/workflows/**'
              - 'apps/web/**'
              - 'contracts/openapi.yaml'
              - 'contracts/fixtures/**'
            docker:
              - *shared
              - 'services/api/**'
              - 'packages/contracts/**'
              - 'contracts/**'
              - 'docker-compose.yml'
              - '.dockerignore'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: npa
          POSTGRES_PASSWORD: npa
          POSTGRES_DB: npa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npa -d npa_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # DB tests run on SQLite and, with this set, on Postgres too (services/api/tests).
      TEST_DATABASE_URL: postgresql+psycopg://npa:npa@localhost:5432/npa_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: Alembic migrations apply and match the ORM
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run python -m alembic -c services/api/alembic.ini upgrade head
          uv run python -m alembic -c services/api/alembic.ini check
          uv run python -m alembic -c services/api/alembic.ini downgrade base
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: uv run python -m mypy
      - name: pytest (all packages)
        run: uv run pytest
      - name: npa_contracts coverage must be 100%
        run: uv run pytest packages/contracts/tests -q --cov=npa_contracts --cov-fail-under=100

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen
      - name: JSON Schemas are up to date
        run: uv run python scripts/export_schemas.py --check
      - name: openapi.yaml is up to date with the API routes
        run: uv run python scripts/export_openapi.py --check
      - name: Validate schemas, openapi and fixtures
        run: uv run python scripts/check_contracts.py

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Detect web app
        id: detect
        working-directory: .
        run: |
          if [ -f apps/web/pnpm-lock.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::apps/web has no pnpm-lock.yaml yet (WS6 task 6.1); skipping web checks"; fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm lint
      - if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck
      - if: steps.detect.outputs.present == 'true'
        run: pnpm test
      - if: steps.detect.outputs.present == 'true'
        run: pnpm build
      - name: Generated API types match contracts/openapi.yaml
        if: steps.detect.outputs.present == 'true' && hashFiles('apps/web/lib/api/types.ts') != ''
        run: |
          pnpm exec openapi-typescript ../../contracts/openapi.yaml -o lib/api/types.ts
          git diff --exit-code -- lib/api/types.ts

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No file larger than 5 MB
        run: |
          big=$(git ls-files -z | xargs -0 -r stat -c '%s %n' | awk '$1 > 5242880')
          if [ -n "$big" ]; then echo "::error::Files over 5 MB:"; echo "$big"; exit 1; fi
      - name: No .env files committed
        run: |
          envs=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$envs" ]; then echo "::error::Committed env files:"; echo "$envs"; exit 1; fi
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    # Builds the API image and runs the compose demo stack end to end (task 5.5).
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the demo stack (migrate + seed on start)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          set -euo pipefail
          api=http://localhost:8000/api/v1
          curl -fsS "$api/health" | tee health.json
          jq -e '.status == "ok"' health.json
          token=$(curl -fsS -X POST "$api/auth/login" -H 'content-type: application/json' \
            -d '{"username":"collector1","password":"demo"}' | jq -r .access_token)
          curl -fsS "$api/collector/queue" -H "Authorization: Bearer $token" \
            | jq -e '.items | length == 10'
          # demo reset twice: idempotent, clear success line
          docker compose exec -T api python -m seed.demo_reset | tee reset1.txt
          docker compose exec -T api python -m seed.demo_reset | tee reset2.txt
          grep -q '^DEMO RESET OK' reset1.txt && grep -q '^DEMO RESET OK' reset2.txt
          # entrypoint pass-through, as used by the Render cron job
          docker compose run --rm -T api python -m app.retention --dry-run
          # the container runs as the non-root app user
          test "$(docker compose exec -T api id -u)" = "10001"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  ci-passed:
    if: always()
    needs: [changes, python, contracts, web, docker, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
