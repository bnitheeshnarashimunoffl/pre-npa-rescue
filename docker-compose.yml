# Local demo stack (owned by WS5, task 5.5).
#   docker compose up --build      -> postgres :5432, api :8000 (web :3000 once WS6 adds its Dockerfile)
# The api container migrates the database and seeds it on first start (SEED_ON_START), using WS1's
# Parquet from ./data/generated when present, else the fixture accounts. Reset the demo with
# `make demo-reset` (keeps the audit log). Wipe everything with `docker compose down -v`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: npa
      POSTGRES_PASSWORD: npa # local demo only; hosted credentials come from the platform
      POSTGRES_DB: npa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npa -d npa"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment: # overrides .env inside the container
      DATABASE_URL: postgresql+psycopg://npa:npa@postgres:5432/npa
      RUN_MIGRATIONS: "true"
      SEED_ON_START: "true"
      WEB_CONCURRENCY: "1"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/generated:/data/generated:ro
      - ./packages/models/artifacts:/models:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # web:
  #   build:
  #     context: apps/web
  #     dockerfile: Dockerfile
  #   environment:
  #     NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
