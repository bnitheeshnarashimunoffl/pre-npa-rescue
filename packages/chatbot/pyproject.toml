[project]
name = "npa-chat"
version = "0.0.1"
description = "Multilingual hardship chatbot: dialogue engine, flows and guardrails."
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=1.13.0",
    "npa-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npa_chat"]
