[project]
name = "npa-contracts"
version = "0.2.0"
description = "Shared contracts for Pre-NPA Rescue: enums, Pydantic models, provider protocols, constants, money helpers."
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npa_contracts"]
