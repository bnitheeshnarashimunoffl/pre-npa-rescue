[project]
name = "datagen"
version = "0.0.1"
description = "Synthetic data generator, feature pipeline and experiment simulator."
requires-python = ">=3.11,<3.12"
dependencies = ["npa-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datagen"]
