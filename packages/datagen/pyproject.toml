[project]
name = "datagen"
version = "0.1.0"
description = "Synthetic data generator, feature pipeline and experiment simulator."
requires-python = ">=3.11,<3.12"
dependencies = [
    "faker>=25",
    "npa-contracts",
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.3",
    "pandera>=0.20",
    "pyarrow>=16,<20",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "xlrd>=2.0",
]

[project.scripts]
datagen = "datagen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datagen"]
