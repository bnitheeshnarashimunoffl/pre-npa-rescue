[project]
name = "npa-models"
version = "0.1.0"
description = "Early-warning, segmentation and uplift models with explanations."
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib>=1.3",
    "lightgbm>=4,<5",
    "npa-contracts",
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.3",
    "pyarrow>=16,<21",  # pyarrow 21+ needs numpy 2; A6 pins numpy 1.26
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "scikit-learn>=1.5,<1.6",
    "scikit-uplift>=0.5",
]

[project.scripts]
npa-models = "npa_models.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npa_models"]
