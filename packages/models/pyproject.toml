[project]
name = "npa-models"
version = "0.0.1"
description = "Early-warning, segmentation and uplift models with explanations."
requires-python = ">=3.11,<3.12"
dependencies = ["npa-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npa_models"]
