[project]
name = "npa-rules"
version = "0.1.0"
description = "Policy engine, relief calculator, compliance guard and next-best-action."
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema>=4.22",
    "npa-contracts",
    "pyyaml>=6",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npa_rules"]
