# uv workspace root for Pre-NPA Rescue (owned by WS5; shared, see contracts/README.md).
# The root is a virtual project: it is never built, it only ties the workspace together
# so that `uv sync` installs every member plus the shared dev tools.

[project]
name = "pre-npa-rescue"
version = "0.1.0"
description = "Pre-NPA Rescue: detect, decide, resolve and prove - before day 90."
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "npa-contracts",
    "datagen",
    "npa-models",
    "npa-rules",
    "npa-chat",
    "npa-api",
    "npa-redteam",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/datagen",
    "packages/models",
    "packages/rules",
    "packages/chatbot",
    "services/api",
    "redteam",
]

[tool.uv.sources]
npa-contracts = { workspace = true }
datagen = { workspace = true }
npa-models = { workspace = true }
npa-rules = { workspace = true }
npa-chat = { workspace = true }
npa-api = { workspace = true }
npa-redteam = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20", "N"]
# RUF001-003: multilingual (ta/hi) strings and the rupee sign are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]
"**/tests/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["npa_contracts", "datagen", "npa_models", "npa_rules", "npa_chat", "app", "npa_redteam"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = [
    "packages/contracts/src",
    "packages/datagen/src",
    "packages/models/src",
    "packages/rules/src",
    "packages/chatbot/src",
    "services/api/app",
    "redteam/src",
    "scripts",
]
mypy_path = [
    "packages/contracts/src",
    "packages/datagen/src",
    "packages/models/src",
    "packages/rules/src",
    "packages/chatbot/src",
    "services/api",
    "redteam/src",
    "scripts",
]
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true

# Strict mode for the shared contracts and the rules engine (A6). mypy has no per-module
# `strict = true`, so the strict flags are listed explicitly.
[[tool.mypy.overrides]]
module = ["npa_contracts", "npa_contracts.*", "npa_rules", "npa_rules.*"]
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest / coverage
[tool.pytest.ini_options]
testpaths = [
    "packages/contracts/tests",
    "packages/datagen/tests",
    "packages/models/tests",
    "packages/rules/tests",
    "packages/chatbot/tests",
    "services/api/tests",
    "redteam/tests",
]
# importlib mode: several packages have a tests/ folder with same-named modules.
addopts = "--import-mode=importlib -ra"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]
