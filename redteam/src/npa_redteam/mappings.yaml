# Requirement catalogue for the compliance scorecard (task 7.2).
#
# Single source of truth for the RBI requirement IDs and BIS standards the scorecard reports on;
# npa_redteam.refs is derived from this file, and every case's rule_refs / bis_refs must appear
# here (a test enforces both directions). Which case covers which requirement lives in the case
# files themselves (rule_refs, bis_refs), so the mapping cannot drift from the cases.
#
# Evidence paths are relative to the repository root and are checked at scorecard time:
#   docs / code / reports: the file exists;  tests: "file.py::test_name" exists in that file.
# Present evidence never makes an RBI requirement "covered" on its own (that needs a passing
# red-team case); for BIS standards, documents and reports count as evidence (briefing 7.2).
#
# redteam: in_scope     -> at least one red-team case must cite it
#          planned      -> red-team cases still to be written (note says which)
#          out_of_scope -> not attackable through chat/API; evidence comes from unit tests/docs
#
# BIS standards use the human-readable form, e.g. "IS/ISO/IEC 42001:2023". Described in our own
# words: design alignment, not certification.

version: "2026.10-v2"

# Model-level fairness from WS2's packages/models/reports/metrics.json (IS/ISO/IEC TR 24027:2021).
fairness:
  max_diff: 0.05   # primary: any |*_diff| above this is a gap -> TR 24027 failing (project value)
  min_ratio: 0.8   # secondary: any *_ratio below this is a warning (four-fifths rule), not a failure

