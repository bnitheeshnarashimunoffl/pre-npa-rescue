# Alembic config (task 5.2). Run from the repo root:
#   uv run python -m alembic -c services/api/alembic.ini upgrade head
# The database URL comes from DATABASE_URL (app.config), not from this file.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
