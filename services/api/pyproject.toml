[project]
name = "npa-api"
version = "0.1.0"
description = "Pre-NPA Rescue FastAPI service: wires the npa_* packages together behind /api/v1."
requires-python = ">=3.11,<3.12"
dependencies = [
    "npa-contracts",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.1,<4",
    "pyarrow>=16",
    "bcrypt>=4.1,<5",
    "pyyaml>=6",
    "pyjwt>=2.8,<3",
    "npa-redteam",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "seed"]

[tool.uv.sources]
npa-redteam = { workspace = true }
