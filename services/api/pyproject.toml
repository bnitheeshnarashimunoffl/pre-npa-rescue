[project]
name = "npa-api"
version = "0.1.0"
description = "Pre-NPA Rescue FastAPI service: wires the npa_* packages together behind /api/v1."
requires-python = ">=3.11,<3.12"
dependencies = [
    "npa-contracts",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
